# =============================================================================
# GlobeX AI — Development Profile Configuration
# =============================================================================
# Active when: SPRING_PROFILES_ACTIVE=dev (default)
# Overrides application.yml for local development.
# Uses local PostgreSQL + Redis + MinIO.
# =============================================================================

spring:
  # ── PostgreSQL (local dev database) ────────────────────────────────────────
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:globex_dev}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:password@2002}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: GlobexHikariPool
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000             # 30 seconds
      idle-timeout: 600000                  # 10 minutes
      max-lifetime: 1800000                 # 30 minutes
      connection-test-query: SELECT 1

  jpa:
    show-sql: true                          # Show SQL in dev for debugging
    properties:
      hibernate:
        format_sql: true

  # ── Cache: use simple in-memory cache in dev (no Redis required) ───────────
  # In production (application-prod.yml) this is overridden to redis.
  cache:
    type: simple

# ── Dev logging — more verbose ────────────────────────────────────────────────
logging:
  level:
    com.globex: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql: TRACE  # Shows bind parameter values
    org.flywaydb: DEBUG

# ── Dev Swagger is always on ──────────────────────────────────────────────────
springdoc:
  swagger-ui:
    enabled: true

# ── Dev CORS — allow any localhost Vite port ──────────────────────────────────
globex:
  cors:
    allowed-origins:
      - http://localhost:5173
      - http://localhost:5174
      - http://localhost:5175
      - http://localhost:3000

  # ── Phase 4 Integration Dev Overrides ───────────────────────────────────────
  integration:
    images:
      provider: ${IMAGE_PROVIDER:unsplash}
      access-key: ${UNSPLASH_ACCESS_KEY:}

    # Phase 5: Duffel dev token (set via DUFFEL_API_TOKEN environment variable)
    duffel:
      api-token: ${DUFFEL_API_TOKEN:}
